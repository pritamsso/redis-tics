name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: false
        default: ''
      force_rebuild:
        description: 'Force a fresh rebuild even if cached artifacts exist'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Determine the version to build/release ─────────────────────────────
  prepare-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump_version.outputs.version }}
      commit_sha: ${{ steps.bump_version.outputs.commit_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Bump version before build
        id: bump_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            npm run version:sync -- "$VERSION"
          else
            CURRENT=$(node -p "require('./package.json').version")

            if git rev-parse "v${CURRENT}" >/dev/null 2>&1; then
              VERSION=$(npm run --silent version:patch)
              echo "Auto-incrementing version from $CURRENT to $VERSION"
            else
              VERSION=$CURRENT
            fi
          fi

          npm run version:check
          npm install --package-lock-only --ignore-scripts
          npm run version:check

          if ! git diff --quiet; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
            git commit -m "chore: bump version to $VERSION [skip ci]"
            git push origin main
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  # ── 2. Decide whether to build or reuse existing artifacts ────────────────
  #
  #  Decision matrix:
  #  ┌─────────────────────────────────────┬──────────────────────────────────┐
  #  │ State                               │ Decision                         │
  #  ├─────────────────────────────────────┼──────────────────────────────────┤
  #  │ force_rebuild = true                │ Fresh build                      │
  #  │ v{VERSION} release already exists   │ Fresh build (version was bumped) │
  #  │ Unexpired artifacts in recent run   │ Skip build — reuse artifacts     │
  #  │ No artifacts found                  │ Fresh build                      │
  #  └─────────────────────────────────────┴──────────────────────────────────┘
  #
  check-artifacts:
    needs: prepare-version
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip_build: ${{ steps.check.outputs.skip_build }}
      artifacts_run_id: ${{ steps.check.outputs.artifacts_run_id }}
    steps:
      - name: Check for reusable build artifacts
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}"

          echo "## Pipeline Intelligence" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`v${VERSION}\` |" >> $GITHUB_STEP_SUMMARY

          # ── force_rebuild overrides everything ──────────────────────────
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "| Decision | **Fresh build** — force_rebuild requested |" >> $GITHUB_STEP_SUMMARY
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "artifacts_run_id=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ── guard: if this version is already published, bump happened ──
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "| Decision | **Fresh build** — v${VERSION} is already published |" >> $GITHUB_STEP_SUMMARY
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "artifacts_run_id=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ── look for a recent run (≤24 h) that has all required artifacts ─
          # We check both failed runs (build ok, release failed) and successful
          # runs (release somehow ran twice) so no artifact set is missed.
          REQUIRED_ARTIFACTS=(
            "redis-tics-macOS-ARM64-updater"
            "redis-tics-macOS-Intel-updater"
            "redis-tics-Linux-appimage"
            "redis-tics-Windows-msi"
          )

          # GNU date (Linux runner) — fallback not needed but kept for clarity
          CUTOFF=$(date -u -d "24 hours ago" +%Y-%m-%dT%H:%M:%SZ)

          ARTIFACTS_RUN_ID=""

          for STATUS in failure success; do
            mapfile -t RUNS < <(gh api \
              "repos/${{ github.repository }}/actions/workflows/release.yml/runs?status=${STATUS}&per_page=10" \
              --jq '.workflow_runs[] | select(.created_at > "'"${CUTOFF}"'") | .id' 2>/dev/null || true)

            for RUN_ID in "${RUNS[@]}"; do
              # Never look at the current run — it has no artifacts yet
              [ "$RUN_ID" = "${{ github.run_id }}" ] && continue

              ARTIFACT_NAMES=$(gh api \
                "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
                --jq '[.artifacts[] | select(.expired == false) | .name]' 2>/dev/null || echo "[]")

              HAS_ALL=true
              for REQUIRED in "${REQUIRED_ARTIFACTS[@]}"; do
                if ! echo "$ARTIFACT_NAMES" | \
                     jq -e --arg n "$REQUIRED" 'index($n) != null' > /dev/null 2>&1; then
                  HAS_ALL=false
                  break
                fi
              done

              if [ "$HAS_ALL" = "true" ]; then
                ARTIFACTS_RUN_ID=$RUN_ID
                break 2
              fi
            done
          done

          if [ -n "$ARTIFACTS_RUN_ID" ]; then
            echo "artifacts_run_id=${ARTIFACTS_RUN_ID}" >> $GITHUB_OUTPUT
            echo "skip_build=true" >> $GITHUB_OUTPUT
            echo "| Previous run | [$ARTIFACTS_RUN_ID](https://github.com/${{ github.repository }}/actions/runs/${ARTIFACTS_RUN_ID}) |" >> $GITHUB_STEP_SUMMARY
            echo "| Decision | **Skipping build** — reusing artifacts from the run above |" >> $GITHUB_STEP_SUMMARY
          else
            echo "artifacts_run_id=" >> $GITHUB_OUTPUT
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "| Decision | **Fresh build** — no reusable artifacts found in the last 24 h |" >> $GITHUB_STEP_SUMMARY
          fi

  # ── 3. Build across all platforms (skipped when artifacts are reused) ─────
  build:
    needs: [prepare-version, check-artifacts]
    if: needs.check-artifacts.outputs.skip_build == 'false'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-15'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
            name: 'macOS-ARM64'
            rust_target: 'aarch64-apple-darwin'
            bundle_path: 'src-tauri/target/aarch64-apple-darwin/release/bundle'
          - platform: 'macos-15'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
            name: 'macOS-Intel'
            rust_target: 'x86_64-apple-darwin'
            bundle_path: 'src-tauri/target/x86_64-apple-darwin/release/bundle'
          - platform: 'ubuntu-22.04'
            args: ''
            target: ''
            name: 'Linux'
            rust_target: ''
            bundle_path: 'src-tauri/target/release/bundle'
          - platform: 'windows-latest'
            args: ''
            target: ''
            name: 'Windows'
            rust_target: ''
            bundle_path: 'src-tauri/target/release/bundle'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-version.outputs.commit_sha }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify updater signing secret
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured."
            echo "Generate an updater signing key locally, commit only the public key to tauri.conf.json, and store the private key in GitHub Actions secrets."
            echo "Auto-update releases cannot be produced without signed updater artifacts."
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Ad-hoc sign macOS app
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          APP_PATH=$(find ${{ matrix.bundle_path }} -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Ad-hoc signing: $APP_PATH"
            codesign --force --deep --sign - "$APP_PATH" || echo "Ad-hoc signing skipped"
          fi

      - name: List built files (debug)
        shell: bash
        run: |
          echo "=== Bundle directory contents ==="
          find ${{ matrix.bundle_path }} -type f 2>/dev/null || echo "Bundle path not found"

      - name: Upload macOS DMG
        if: matrix.platform == 'macos-15'
        uses: actions/upload-artifact@v5
        with:
          name: redis-tics-${{ matrix.name }}-dmg
          path: |
            ${{ matrix.bundle_path }}/dmg/*.dmg
            ${{ matrix.bundle_path }}/dmg/*.dmg.sig
          if-no-files-found: warn

      - name: Upload macOS updater archive
        if: matrix.platform == 'macos-15'
        uses: actions/upload-artifact@v5
        with:
          name: redis-tics-${{ matrix.name }}-updater
          path: |
            ${{ matrix.bundle_path }}/macos/*.tar.gz
            ${{ matrix.bundle_path }}/macos/*.tar.gz.sig
          if-no-files-found: warn

      - name: Upload Linux DEB
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v5
        with:
          name: redis-tics-${{ matrix.name }}-deb
          path: ${{ matrix.bundle_path }}/deb/*.deb
          if-no-files-found: warn

      - name: Upload Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v5
        with:
          name: redis-tics-${{ matrix.name }}-appimage
          path: |
            ${{ matrix.bundle_path }}/appimage/*.AppImage
            ${{ matrix.bundle_path }}/appimage/*.AppImage.sig
          if-no-files-found: warn

      - name: Upload Windows MSI
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: redis-tics-${{ matrix.name }}-msi
          path: |
            ${{ matrix.bundle_path }}/msi/*.msi
            ${{ matrix.bundle_path }}/msi/*.msi.sig
          if-no-files-found: warn

      - name: Upload Windows NSIS
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: redis-tics-${{ matrix.name }}-nsis
          path: |
            ${{ matrix.bundle_path }}/nsis/*.exe
            ${{ matrix.bundle_path }}/nsis/*.exe.sig
          if-no-files-found: warn

  # ── 4. Package and publish the GitHub release ─────────────────────────────
  #
  #  Runs when:
  #   • build succeeded  (fresh build path), OR
  #   • build was skipped (artifact-reuse path)
  release:
    needs: [prepare-version, check-artifacts, build]
    if: |
      always() &&
      needs.prepare-version.result == 'success' &&
      needs.check-artifacts.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-version.outputs.commit_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from prepare job
        id: get_version
        shell: bash
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Download artifacts (from this run)
        if: needs.check-artifacts.outputs.skip_build == 'false'
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Download artifacts (reusing previous build)
        if: needs.check-artifacts.outputs.skip_build == 'true'
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          run-id: ${{ needs.check-artifacts.outputs.artifacts_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded artifacts
        shell: bash
        run: |
          echo "=== All downloaded artifacts ==="
          find artifacts -type f

      - name: Prepare release files
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          mkdir -p release-files

          copy_first() {
            local artifact_dir="$1"
            local name_pattern="$2"
            local destination="$3"
            local required="${4:-required}"
            local source
            source=$(find "$artifact_dir" -type f -name "$name_pattern" | sort | head -1 || true)
            if [ -z "$source" ]; then
              if [ "$required" = "required" ]; then
                echo "Missing artifact matching ${name_pattern} in ${artifact_dir}"
                exit 1
              fi
              return 0
            fi
            cp "$source" "$destination"
          }

          # User-facing installers.
          copy_first "artifacts/redis-tics-macOS-ARM64-dmg" "*.dmg" "release-files/Redis.Tics_${VERSION}_aarch64.dmg" optional
          copy_first "artifacts/redis-tics-macOS-Intel-dmg" "*.dmg" "release-files/Redis.Tics_${VERSION}_x64.dmg" optional
          copy_first "artifacts/redis-tics-Linux-deb" "*.deb" "release-files/redis-tics_${VERSION}_amd64.deb" optional
          copy_first "artifacts/redis-tics-Windows-nsis" "*.exe" "release-files/Redis.Tics_${VERSION}_x64-setup.exe" optional

          # Updater artifacts. These must exist and must be signed.
          copy_first "artifacts/redis-tics-macOS-ARM64-updater" "*.tar.gz" "release-files/Redis.Tics_${VERSION}_aarch64.app.tar.gz"
          copy_first "artifacts/redis-tics-macOS-ARM64-updater" "*.tar.gz.sig" "release-files/Redis.Tics_${VERSION}_aarch64.app.tar.gz.sig"
          copy_first "artifacts/redis-tics-macOS-Intel-updater" "*.tar.gz" "release-files/Redis.Tics_${VERSION}_x64.app.tar.gz"
          copy_first "artifacts/redis-tics-macOS-Intel-updater" "*.tar.gz.sig" "release-files/Redis.Tics_${VERSION}_x64.app.tar.gz.sig"
          copy_first "artifacts/redis-tics-Linux-appimage" "*.AppImage" "release-files/Redis.Tics_${VERSION}_amd64.AppImage"
          copy_first "artifacts/redis-tics-Linux-appimage" "*.AppImage.sig" "release-files/Redis.Tics_${VERSION}_amd64.AppImage.sig"
          copy_first "artifacts/redis-tics-Windows-msi" "*.msi" "release-files/Redis.Tics_${VERSION}_x64-setup.msi"
          copy_first "artifacts/redis-tics-Windows-msi" "*.msi.sig" "release-files/Redis.Tics_${VERSION}_x64-setup.msi.sig"

          echo "=== Files to release ==="
          ls -la release-files/

      - name: Generate Tauri updater manifest (latest.json)
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES="Redis Tics v${VERSION} - See release notes for details"

          SIG_MAC_ARM=""
          SIG_MAC_X64=""
          SIG_LINUX_APPIMAGE=""
          SIG_WINDOWS_MSI=""
          MAC_ARM_FILE="Redis.Tics_${VERSION}_aarch64.app.tar.gz"
          MAC_X64_FILE="Redis.Tics_${VERSION}_x64.app.tar.gz"
          LINUX_FILE="Redis.Tics_${VERSION}_amd64.AppImage"
          WINDOWS_FILE="Redis.Tics_${VERSION}_x64-setup.msi"

          [ -f "release-files/${MAC_ARM_FILE}.sig" ] && SIG_MAC_ARM=$(cat "release-files/${MAC_ARM_FILE}.sig")
          [ -f "release-files/${MAC_X64_FILE}.sig" ] && SIG_MAC_X64=$(cat "release-files/${MAC_X64_FILE}.sig")
          [ -f "release-files/${LINUX_FILE}.sig" ] && SIG_LINUX_APPIMAGE=$(cat "release-files/${LINUX_FILE}.sig")
          [ -f "release-files/${WINDOWS_FILE}.sig" ] && SIG_WINDOWS_MSI=$(cat "release-files/${WINDOWS_FILE}.sig")

          for required in "${MAC_ARM_FILE}" "${MAC_ARM_FILE}.sig" "${MAC_X64_FILE}" "${MAC_X64_FILE}.sig" "${LINUX_FILE}" "${LINUX_FILE}.sig" "${WINDOWS_FILE}" "${WINDOWS_FILE}.sig"; do
            if [ ! -f "release-files/${required}" ]; then
              echo "Missing updater artifact: release-files/${required}"
              exit 1
            fi
          done

          cat > release-files/latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "${NOTES}",
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIG_MAC_ARM}",
                "url": "https://github.com/pritamsso/redis-tics/releases/download/v${VERSION}/${MAC_ARM_FILE}"
              },
              "darwin-x86_64": {
                "signature": "${SIG_MAC_X64}",
                "url": "https://github.com/pritamsso/redis-tics/releases/download/v${VERSION}/${MAC_X64_FILE}"
              },
              "linux-x86_64": {
                "signature": "${SIG_LINUX_APPIMAGE}",
                "url": "https://github.com/pritamsso/redis-tics/releases/download/v${VERSION}/${LINUX_FILE}"
              },
              "windows-x86_64": {
                "signature": "${SIG_WINDOWS_MSI}",
                "url": "https://github.com/pritamsso/redis-tics/releases/download/v${VERSION}/${WINDOWS_FILE}"
              }
            }
          }
          EOF

          jq -e '
            .version and .platforms and
            (.platforms | to_entries | all(.value.url != "" and .value.signature != ""))
          ' release-files/latest.json
          echo "Generated latest.json for auto-updater"

      - name: Verify updater signature files exist and are non-empty
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Checking signature files for v${VERSION}..."

          check_sig() {
            local sig="$1"
            if [ ! -f "$sig" ]; then
              echo "MISSING: $sig"
              exit 1
            fi
            if [ ! -s "$sig" ]; then
              echo "EMPTY: $sig"
              exit 1
            fi
            echo "OK: $sig ($(wc -c < "$sig") bytes)"
          }

          check_sig "release-files/Redis.Tics_${VERSION}_aarch64.app.tar.gz.sig"
          check_sig "release-files/Redis.Tics_${VERSION}_x64.app.tar.gz.sig"
          check_sig "release-files/Redis.Tics_${VERSION}_amd64.AppImage.sig"
          check_sig "release-files/Redis.Tics_${VERSION}_x64-setup.msi.sig"
          echo "All signature files present and non-empty."

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          echo "## What's Changed" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          if [ -n "$LAST_TAG" ]; then
            git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges >> RELEASE_NOTES.md
          else
            echo "- Initial release 🎉" >> RELEASE_NOTES.md
          fi

          echo "" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Downloads" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "| Platform | Architecture | File |" >> RELEASE_NOTES.md
          echo "|----------|--------------|------|" >> RELEASE_NOTES.md
          echo "| macOS | Apple Silicon (M1/M2/M3) | \`Redis Tics_*.dmg\` (aarch64) |" >> RELEASE_NOTES.md
          echo "| macOS | Intel | \`Redis Tics_*.dmg\` (x86_64) |" >> RELEASE_NOTES.md
          echo "| Windows | x64 | \`.msi\` or \`.exe\` |" >> RELEASE_NOTES.md
          echo "| Linux | x64 | \`.deb\` or \`.AppImage\` |" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 🔄 Auto-Update" >> RELEASE_NOTES.md
          echo "This version supports automatic updates. You'll be notified when new versions are available." >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "---" >> RELEASE_NOTES.md
          echo "Made with ❤️ by [@pritamsso](https://github.com/pritamsso)" >> RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Redis Tics v${{ steps.get_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: release-files/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update releases.json for website
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)

          echo "🔄 Updating releases.json for version ${VERSION}"

          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            echo "📝 Getting changes since ${LAST_TAG}"
            CHANGES=$(git log ${LAST_TAG}..HEAD --pretty=format:'"%s"' --no-merges | grep -v "chore: update releases.json" | head -15 | tr '\n' ',' | sed 's/,$//')
            if [ -z "$CHANGES" ]; then
              CHANGES='"Performance improvements and bug fixes"'
            fi
          else
            CHANGES='"Initial release with multi-server management","Real-time command monitoring","Memory analytics with MEMORY STATS","Command statistics and slow log analysis","Redis Cluster support","Persistence status monitoring","Cross-platform support (macOS, Windows, Linux)"'
          fi

          cat > /tmp/new_release.json << EOF
          {
            "version": "${VERSION}",
            "date": "${DATE}",
            "title": "Redis Tics v${VERSION}",
            "description": "New release of Redis Tics with improvements and fixes",
            "changes": [${CHANGES}],
            "downloads": {
              "macos_arm": "https://github.com/pritamsso/redis-tics/releases/download/v${VERSION}/Redis.Tics_${VERSION}_aarch64.dmg",
              "macos_intel": "https://github.com/pritamsso/redis-tics/releases/download/v${VERSION}/Redis.Tics_${VERSION}_x64.dmg",
              "windows_msi": "https://github.com/pritamsso/redis-tics/releases/download/v${VERSION}/Redis.Tics_${VERSION}_x64-setup.msi",
              "windows_exe": "https://github.com/pritamsso/redis-tics/releases/download/v${VERSION}/Redis.Tics_${VERSION}_x64-setup.exe",
              "linux_deb": "https://github.com/pritamsso/redis-tics/releases/download/v${VERSION}/redis-tics_${VERSION}_amd64.deb",
              "linux_appimage": "https://github.com/pritamsso/redis-tics/releases/download/v${VERSION}/Redis.Tics_${VERSION}_amd64.AppImage"
            }
          }
          EOF

          echo "📦 New release entry:"
          cat /tmp/new_release.json | jq .

          if [ -f docs/releases.json ]; then
            echo "📄 Updating existing releases.json"
            jq --argjson new "$(cat /tmp/new_release.json)" \
               '.latest = $new.version | .releases = ([$new] + (.releases | map(select(.version != $new.version))))' \
               docs/releases.json > /tmp/releases_updated.json
            mv /tmp/releases_updated.json docs/releases.json
          else
            echo "📄 Creating new releases.json"
            jq -n --argjson new "$(cat /tmp/new_release.json)" \
               '{latest: $new.version, releases: [$new]}' > docs/releases.json
          fi

          echo "✅ Updated releases.json:"
          cat docs/releases.json | jq '.releases | map({version, date}) | .[:3]'

      - name: Commit and push releases.json
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add docs/releases.json
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to releases.json"
            exit 0
          fi

          echo "🧹 Ensuring clean git state..."
          git diff --name-only -z -- . ':(exclude)docs/releases.json' | xargs -0 -r git checkout --
          rm -rf RELEASE_NOTES.md artifacts release-files
          git status --short

          git commit -m "chore: update releases.json for v${{ steps.get_version.outputs.version }} [skip ci]"

          echo "📥 Fetching latest changes from remote..."
          git fetch origin main

          echo "🔄 Rebasing on origin/main..."
          git rebase origin/main || {
            echo "⚠️ Rebase conflict detected, attempting to resolve..."
            if git diff --name-only --diff-filter=U | grep -q "docs/releases.json"; then
              echo "📝 Accepting our version of releases.json..."
              git checkout --ours docs/releases.json
              git add docs/releases.json
              git rebase --continue || {
                echo "❌ Failed to resolve conflicts"
                git rebase --abort
                exit 1
              }
            else
              echo "❌ Unexpected conflict in other files"
              git rebase --abort
              exit 1
            fi
          }

          echo "📤 Pushing changes..."
          git push origin HEAD:main
          echo "✅ Updated releases.json and pushed to repository"
